name: atc_schedule_manager
description: Web Schedule Manager with private on-device schedule parsing and calendar sync.
publish_to: 'none'
version: 0.12.3+31

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  file_picker: 10.3.10
  pdfx: ^2.11.0
  photo_manager: ^3.12.0
  google_mlkit_text_recognition: ^0.15.1
  device_calendar_plus: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
