name: atc_schedule_manager
description: ATC Schedule Manager screenshot import edition with local schedule parsing and calendar sync.
publish_to: 'none'
version: 0.10.0+10

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.1
  device_calendar_plus: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
