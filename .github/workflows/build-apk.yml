name: Build Android APK # v0.10.14 rebuild

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'v*'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name atc_schedule_manager .
          fi

      - name: Configure Android app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          BUILD_FILE=android/app/build.gradle.kts
          if ! grep -q 'READ_CALENDAR' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_CALENDAR" />' "$MANIFEST"
          fi
          if ! grep -q 'READ_MEDIA_IMAGES' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' "$MANIFEST"
          fi
          if grep -q 'minSdk = flutter.minSdkVersion' "$BUILD_FILE"; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$BUILD_FILE"
          fi
          PROGUARD_FILE=android/app/proguard-rules.pro
          printf '%s\\n' \\
            '-dontwarn com.google.mlkit.vision.text.chinese.**' \\
            '-dontwarn com.google.mlkit.vision.text.devanagari.**' \\
            '-dontwarn com.google.mlkit.vision.text.japanese.**' \\
            '-dontwarn com.google.mlkit.vision.text.korean.**' \\
            > "$PROGUARD_FILE"
          if ! grep -q 'proguard-rules.pro' "$BUILD_FILE"; then
            sed -i '/release {/a\\            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")' "$BUILD_FILE"
          fi
          grep -q 'proguardFiles' "$BUILD_FILE"
          sed -i 's/android:label="atc_schedule_manager"/android:label="ATC Schedule Manager Lite"/' "$MANIFEST"
          sed -i 's/applicationId = "com.example.atc_schedule_manager"/applicationId = "com.ryantowns.atcschedulemanager.lite"/' "$BUILD_FILE"
          grep -q 'android:label="ATC Schedule Manager Lite"' "$MANIFEST"
          grep -q 'applicationId = "com.ryantowns.atcschedulemanager.lite"' "$BUILD_FILE"
          grep -q 'READ_MEDIA_IMAGES' "$MANIFEST"

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build ARM64 release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atc-schedule-manager-lite-v0.10.14-arm64-release-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
